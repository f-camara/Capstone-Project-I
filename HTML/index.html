<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../CSS/styles.css">
        <title>Capstone Project</title>
    </head>
    <body>
        <main>
            <section class="container-fluid order-head-section">
                <div class="row gy-1">
                    <div class="col-12 col-md-6 gy-3">
                        <div class="order-creation">
                            <form>
                                <label for="main-ingredient">Enter an ingredient to generate a random order:</label>
                                <br>
                                <input type="text" id="main-ingredient" name="main-ingredient" placeholder="Main Ingredient" required>
                                <br>
                                <input type="submit" id="submit-button" value="Submit">
                            </form>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 gy-3">
                        <div class="order-completion">
                            <form>
                                <label for="mark-as-complete-number">Enter an order number to mark it as completed:</label>
                                <br>
                                <input type="number" id="mark-as-complete-number" name="mark-as-complete-number" placeholder="Order Number" required>
                                <br>
                                <input type="submit" id="complete-order-button" value="Mark As Complete">
                            </form>
                        </div>
                    </div>
                </div>
            </section>
            <section class="container-fluid">
                <div class="row gy-1">
                    <div class="col-12 col-md-12">
                        <div class="inc-ord-sect">
                            <h2>Incomplete Orders</h2>
                            <div id="incomplete-orders-section">
                                <table id="incomplete-orders-table">
                                    <thead>
                                        <tr>
                                            <th>Order Number</th>
                                            <th>Meal Name</th>
                                            <th>Order Status</th>
                                        </tr>
                                    </thead>
                                    <tbody id="incomplete-orders-tbody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row gy-1">
                    <div class="col-12 col-md-12">
                        <div class="comp-ord-sect">
                            <h2>Complete Orders</h2>
                            <div id="complete-orders-section">
                                <table id="complete-orders-table">
                                    <thead>
                                        <tr>
                                            <th>Order Number</th>
                                            <th>Meal Name</th>
                                            <th>Order Status</th>
                                        </tr>
                                    </thead>
                                    <tbody id="complete-orders-tbody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="../JS/scripts.js" type="module"></script>
    </body>
</html>
